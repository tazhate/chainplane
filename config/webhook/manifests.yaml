---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-chains-chainplane-io-v1alpha2-chaininstance
  failurePolicy: Fail
  name: vchaininstance.kb.io
  rules:
  - apiGroups:
    - chains.chainplane.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - chaininstances
  sideEffects: None
