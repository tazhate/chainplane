---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-nodes-k8s-bch-io-v1alpha1-blockchainnode
  failurePolicy: Fail
  name: vblockchainnode.kb.io
  rules:
  - apiGroups:
    - nodes.k8s-bch.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - blockchainnodes
  sideEffects: None
