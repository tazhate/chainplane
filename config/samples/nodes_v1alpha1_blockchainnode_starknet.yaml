apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  name: starknet-mainnet-01
  namespace: blockchain-nodes
spec:
  chain: starknet
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  rpc:
    enabled: true
    port: 6060
  storage:
    size: "500Gi"
    storageClass: fast-nvme
  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "32Gi"
  health:
    blockLagThreshold: 50
    degradedTimeoutMinutes: 15
