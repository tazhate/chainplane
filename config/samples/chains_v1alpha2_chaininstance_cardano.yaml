apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: cardano-mainnet
spec:
  chain: cardano
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: ghcr.io/intersectmbo/cardano-node:10.6.2
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 24Gi
  rpc:
    enabled: true
    port: 12798
