apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: morph-mainnet
spec:
  chain: morph
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: morphl2/morphnode:v0.3.0
  # L1_RPC_URL env var defaults to http://ethereum-mainnet-01.blockchain-nodes.svc.cluster.local:8545
  # Override via extraEnv if using a different L1 endpoint.
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
