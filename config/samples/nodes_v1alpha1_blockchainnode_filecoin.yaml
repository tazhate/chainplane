apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  name: filecoin-mainnet-01
  namespace: blockchain-nodes
spec:
  chain: filecoin
  network: mainnet
  nodeType: rpc
  nodeGroup: archive
  rpc:
    enabled: true
    port: 1234
  storage:
    size: "2Ti"
    storageClass: fast-nvme
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "16"
      memory: "64Gi"
  health:
    blockLagThreshold: 10
    degradedTimeoutMinutes: 30
