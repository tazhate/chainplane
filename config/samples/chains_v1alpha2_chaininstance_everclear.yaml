apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: everclear-mainnet
spec:
  chain: everclear
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: see internal/adapters/versions_gen.go
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # Everclear's chain info is not built into Nitro: pass it with
  # extraArgs (--chain.info-json=...).
  # Override the L1 execution and beacon endpoints
  # (defaults: http://ethereum:8545, http://ethereum-beacon:5052)
  # extraEnv:
  # - name: L1_RPC_URL
  #   value: "http://your-ethereum-rpc:8545"
  # - name: L1_BEACON_URL
  #   value: "http://your-beacon-node:5052"
