apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: kava-mainnet
spec:
  chain: kava
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: kava-labs/kava:v0.26.2
  storage:
    size: 1Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 26657
