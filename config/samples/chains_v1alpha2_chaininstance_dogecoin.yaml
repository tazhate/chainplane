apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: dogecoin-mainnet
spec:
  chain: dogecoin
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: dogecoin/dogecoin:1.14.8
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 22555
  health:
    blockLagThreshold: 5
