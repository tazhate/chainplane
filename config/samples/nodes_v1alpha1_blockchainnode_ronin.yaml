apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: ronin-mainnet
spec:
  chain: ronin
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: axieinfinity/ronin:v2.8.3
  storage:
    size: 1Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
