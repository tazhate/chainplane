apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: stellar-mainnet
spec:
  chain: stellar
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: stellar/stellar-core:latest
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 11626
