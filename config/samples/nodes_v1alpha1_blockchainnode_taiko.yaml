apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: taiko-mainnet
spec:
  chain: taiko
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: taikoxyz/taiko-geth:v1.8.0
  # L1_RPC_URL env var defaults to http://ethereum:8545
  # Override via extraEnv if using a different L1 endpoint.
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
