apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: rootstock-mainnet
spec:
  chain: rootstock
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: rsksmart/rskj:ARROWHEAD-6.4.0
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 4444
  health:
    blockLagThreshold: 30
