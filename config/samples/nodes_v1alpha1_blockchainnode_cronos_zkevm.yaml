apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: cronos-zkevm-mainnet
spec:
  chain: cronos-zkevm
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: cryptocom/cronos-zkevm-node:v0.1.0
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # Override default L1 RPC URL (default: http://ethereum:8545)
  # extraEnv:
  # - name: L1_RPC_URL
  #   value: "http://your-ethereum-rpc:8545"
