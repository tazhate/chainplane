apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: ton-mainnet
spec:
  chain: ton
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: ghcr.io/ton-blockchain/ton:latest
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 30003
  # Optional: bootstrap from dump.ton.org for faster initial sync
  # extraEnv:
  #   - name: DUMP_URL
  #     value: "https://dump.ton.org/dumps/latest.tar.lz"
