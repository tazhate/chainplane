apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: moonriver-mainnet
spec:
  chain: moonriver
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: moonbeamfoundation/moonbeam:v0.39.1 (same binary as Moonbeam)
  # Moonriver is a Kusama parachain with EVM compatibility.
  # RPC port: 9944 (Substrate / eth-compatible), P2P port: 30333
  storage:
    size: 1000Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
  rpc:
    enabled: true
    port: 9944
    wsPort: 9945
  health:
    blockLagThreshold: 30
