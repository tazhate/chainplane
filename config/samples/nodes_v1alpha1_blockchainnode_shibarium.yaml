apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: shibarium-mainnet
spec:
  chain: shibarium
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: shibaswap/shibarium-node:v1.0.0
  # L1_RPC_URL env var defaults to http://ethereum:8545
  # Override via extraEnv if using a different L1 endpoint.
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
