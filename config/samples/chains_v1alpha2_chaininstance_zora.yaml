apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: zora-mainnet
spec:
  chain: zora
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101411.2
  # L1_RPC_URL env var defaults to http://ethereum:8545
  # Override via extraEnv if using a different L1 endpoint.
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
