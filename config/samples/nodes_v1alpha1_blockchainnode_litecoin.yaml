apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: litecoin-mainnet
spec:
  chain: litecoin
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: uphold/litecoin-core:0.21
  storage:
    size: 200Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 9332
  health:
    blockLagThreshold: 5
