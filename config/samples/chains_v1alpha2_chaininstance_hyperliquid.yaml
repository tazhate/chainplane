apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  name: hyperliquid-mainnet-01
  namespace: blockchain-nodes
spec:
  chain: hyperliquid
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  rpc:
    enabled: true
    port: 3001
  storage:
    size: "2000Gi"
    storageClass: fast-nvme
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "16"
      memory: "64Gi"
  health:
    blockLagThreshold: 30
    degradedTimeoutMinutes: 15
