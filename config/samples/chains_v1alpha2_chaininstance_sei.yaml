apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: sei-mainnet
spec:
  chain: sei
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: seiprotocol/seid:v5.9.0
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 26657
