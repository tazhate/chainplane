apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: dash-mainnet
spec:
  chain: dash
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: dashpay/dashd:23.1.0
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 9998
  health:
    blockLagThreshold: 5
