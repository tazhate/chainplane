apiVersion: nodes.k8s-bch.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: xrp-mainnet
spec:
  chain: xrp
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: xrpllabsofficial/xrpld:3.1.2
  storage:
    size: 300Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  rpc:
    enabled: true
    port: 5005
