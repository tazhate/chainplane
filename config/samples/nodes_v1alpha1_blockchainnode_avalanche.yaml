apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: avalanche-mainnet
spec:
  chain: avalanche
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: avaplatform/avalanchego:v1.14.1
  storage:
    size: 1Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 9650
