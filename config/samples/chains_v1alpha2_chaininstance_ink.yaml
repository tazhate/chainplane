apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: ink-mainnet
spec:
  chain: ink
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: see internal/adapters/versions_gen.go
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # op-node runs as a sidecar and follows L1 through an execution and a
  # beacon endpoint (defaults: http://ethereum:8545, http://ethereum-beacon:5052).
  # extraEnv:
  # - name: L1_RPC_URL
  #   value: "http://your-ethereum-rpc:8545"
  # - name: L1_BEACON_URL
  #   value: "http://your-ethereum-beacon:5052"
