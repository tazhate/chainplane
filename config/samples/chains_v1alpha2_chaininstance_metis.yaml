apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: metis-mainnet
spec:
  chain: metis
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: see internal/adapters/versions_gen.go
  # Metis is an L2 chain (l2geth-based). l2geth syncs from the Metis data
  # transport layer (metisdao/dtl), which reads Ethereum; it is not deployed
  # by the operator. ROLLUP_CLIENT_HTTP defaults to http://metis-dtl:7878.
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # Point l2geth at your DTL:
  # extraEnv:
  # - name: ROLLUP_CLIENT_HTTP
  #   value: "http://your-metis-dtl:7878"
