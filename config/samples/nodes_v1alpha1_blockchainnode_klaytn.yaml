apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: klaytn-mainnet
spec:
  chain: klaytn
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: kaiachain/kaia:v1.0.3
  storage:
    size: 2000Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "8"
      memory: 16Gi
    limits:
      cpu: "16"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8551
    wsPort: 8552
  health:
    blockLagThreshold: 30
