apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: moonbeam-mainnet
spec:
  chain: moonbeam
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: moonbeamfoundation/moonbeam:v0.39.1
  # Moonbeam is a Polkadot parachain with EVM compatibility.
  # RPC port: 9944 (Substrate / eth-compatible), P2P port: 30333
  storage:
    size: 2000Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 9944
    wsPort: 9945
  health:
    blockLagThreshold: 30
