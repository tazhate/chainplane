apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: gnosis-mainnet
spec:
  chain: gnosis
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: nethermind/nethermind:1.36.1
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  rpc:
    enabled: true
    port: 8545
