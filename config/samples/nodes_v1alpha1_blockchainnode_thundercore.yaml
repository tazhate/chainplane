apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: thundercore-mainnet
spec:
  chain: thundercore
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: thundercore/thundercore:v2.21.0
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
