apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: ethereum-mainnet
spec:
  chain: ethereum
  network: mainnet
  nodeType: rpc
  # Supported clients: nethermind (default), geth, reth, erigon
  client: nethermind
  nodeGroup: heavy
  # Default image: nethermind/nethermind:1.36.1
  storage:
    size: 2Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
