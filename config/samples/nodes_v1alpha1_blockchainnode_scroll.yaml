apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: scroll-mainnet
spec:
  chain: scroll
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: scrolltech/l2geth:scroll-v5.9.0
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
    degradedTimeoutMinutes: 15
  # L1 Ethereum RPC URL (override via extraEnv if needed)
  extraEnv:
    - name: L1_RPC_URL
      value: "http://ethereum:8545"
