apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: playnance-mainnet
spec:
  chain: playnance
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: see internal/adapters/versions_gen.go
  storage:
    size: 100Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # The parent chain is Arbitrum Nova (default: https://nova.arbitrum.io/rpc).
  # The chain info and DAS URLs are not built into Nitro: pass them with
  # extraArgs (--chain.info-json=..., --node.da.anytrust.*).
  # extraEnv:
  # - name: L1_RPC_URL
  #   value: "http://your-nova-rpc:8547"
