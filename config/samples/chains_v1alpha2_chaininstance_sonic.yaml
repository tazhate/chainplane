apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: sonic-mainnet
spec:
  chain: sonic
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: fantomfoundation/sonic:v1.2.0
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
  rpc:
    enabled: true
    port: 18545
    wsPort: 18546
  health:
    blockLagThreshold: 30
