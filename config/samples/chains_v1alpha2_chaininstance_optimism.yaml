apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: optimism-mainnet
spec:
  chain: optimism
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: see internal/adapters/versions_gen.go
  storage:
    size: 1Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # OP Mainnet requires spec.snapshot: op-reth exits on an empty datadir with
  # "launched without importing the pre-Bedrock state". The snapshot archive
  # (default bucket snapshots-optimism) must contain the op-reth datadir as reth/.
  # op-node runs as a sidecar and follows L1 through an execution and a
  # beacon endpoint (defaults: http://ethereum:8545, http://ethereum-beacon:5052).
  # extraEnv:
  # - name: L1_RPC_URL
  #   value: "http://your-ethereum-rpc:8545"
  # - name: L1_BEACON_URL
  #   value: "http://your-ethereum-beacon:5052"
