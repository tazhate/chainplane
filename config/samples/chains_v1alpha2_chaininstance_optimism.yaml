apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: optimism-mainnet
spec:
  chain: optimism
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101411.2
  storage:
    size: 1Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  rpc:
    enabled: true
    port: 8545
    wsPort: 8546
  health:
    blockLagThreshold: 30
  # Override default L1 RPC URL (default: http://ethereum:8545)
  # extraEnv:
  # - name: OP_NODE_L1_ETH_RPC
  #   value: "http://your-ethereum-rpc:8545"
