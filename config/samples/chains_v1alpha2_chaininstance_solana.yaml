apiVersion: chains.chainplane.io/v1alpha2
kind: ChainInstance
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: solana-mainnet
spec:
  chain: solana
  network: mainnet
  nodeType: rpc
  nodeGroup: heavy
  # Default image: see internal/adapters/versions_gen.go
  storage:
    size: 2Ti
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "12"
      memory: 128Gi
    limits:
      cpu: "16"
      memory: 256Gi
  rpc:
    enabled: true
    port: 8899
    wsPort: 8900
