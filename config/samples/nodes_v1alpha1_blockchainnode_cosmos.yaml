apiVersion: nodes.chainplane.io/v1alpha1
kind: BlockchainNode
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: cosmos-mainnet
spec:
  chain: cosmos
  network: mainnet
  nodeType: rpc
  nodeGroup: medium
  # Default image: ghcr.io/cosmos/gaia:v27.0.0
  storage:
    size: 500Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  rpc:
    enabled: true
    port: 26657
