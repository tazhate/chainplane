# This rule is not used by the project blockchain-node-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over nodes.nodes.k8s-bch.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: blockchain-node-operator
    app.kubernetes.io/managed-by: kustomize
  name: blockchainnode-admin-role
rules:
- apiGroups:
  - nodes.nodes.k8s-bch.io
  resources:
  - blockchainnodes
  verbs:
  - '*'
- apiGroups:
  - nodes.nodes.k8s-bch.io
  resources:
  - blockchainnodes/status
  verbs:
  - get
