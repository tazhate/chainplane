---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - nodes.chainplane.io
  resources:
  - chainversioncatalogs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nodes.chainplane.io
  resources:
  - chainversioncatalogs/finalizers
  verbs:
  - update
- apiGroups:
  - nodes.chainplane.io
  resources:
  - chainversioncatalogs/status
  verbs:
  - get
  - patch
  - update
