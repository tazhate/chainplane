# This rule is not used by the project chainplane itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to nodes.chains.chainplane.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chainplane
    app.kubernetes.io/managed-by: kustomize
  name: chaininstance-viewer-role
rules:
- apiGroups:
  - nodes.chains.chainplane.io
  resources:
  - chaininstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nodes.chains.chainplane.io
  resources:
  - chaininstances/status
  verbs:
  - get
