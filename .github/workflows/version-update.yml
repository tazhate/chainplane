name: Update node image versions

on:
  schedule:
    - cron: '0 8 * * 1' # каждый понедельник 08:00 UTC
  workflow_dispatch:

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Upstream registry errors for individual chains must not block the PR
      # for the chains that did resolve; the build/lint/test steps below still
      # gate whatever was written.
      - name: Check for version updates
        continue-on-error: true
        run: go run ./cmd/versioncheck --update
        env:
          # Optional: authenticate to lift Docker Hub's anonymous rate limit
          # (180 req/min per IP). Both must be set; the token is a Docker Hub
          # personal access token with read-only public repo scope.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify build after update
        run: go build ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.4

      - name: Run tests
        run: go test ./internal/adapters/... ./internal/registry/... ./api/...

      - name: Create PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: |
            chore: update blockchain node default images

            Ran cmd/versioncheck against upstream registries.
            Updated internal/adapters/versions_gen.go.
          title: 'chore: update node images'
          body: |
            ## Automated image version update

            `cmd/versioncheck` found newer stable tags in upstream registries and updated
            `internal/adapters/versions_gen.go`.

            Only clean semver tags are proposed: pre-releases (alpha/beta/rc),
            nightly and suffixed service builds are skipped. Defaults that are
            already on a floating tag (e.g. `:latest`) in `versions_gen.go` are
            not pinned by this job.

            Build, lint and the adapters/registry/api tests passed. Review the
            bumped images before merging.
          branch: chore/update-node-images
          delete-branch: true
          labels: dependencies
