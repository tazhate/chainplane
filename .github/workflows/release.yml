name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate: nothing is pushed to GHCR unless the tagged commit passes the same
  # envtest suite and linter that run on branches.
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.4

  release:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Sanity check
        run: go build ./... && go vet ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tazhate/chainplane:${{ github.ref_name }}
            ghcr.io/tazhate/chainplane:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tazhate/chainplane
            org.opencontainers.image.url=https://github.com/tazhate/chainplane
            org.opencontainers.image.documentation=https://github.com/tazhate/chainplane
            org.opencontainers.image.title=chainplane
            org.opencontainers.image.description=Kubernetes operator for blockchain full nodes
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The operator binary defaults to snapshot-restore:<same tag> (VERSION
      # build-arg above), so this image must exist for every release tag.
      - name: Build and push snapshot-restore image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: snapshot-restore.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/tazhate/chainplane/snapshot-restore:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/tazhate/chainplane
            org.opencontainers.image.title=chainplane-snapshot-restore
            org.opencontainers.image.description=Init container that restores blockchain node snapshots for chainplane
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Package and push Helm chart to GHCR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package charts/chainplane --version "${VERSION}"
          helm push "chainplane-${VERSION}.tgz" oci://ghcr.io/tazhate/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: chainplane-*.tgz
