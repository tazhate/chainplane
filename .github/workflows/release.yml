name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate: nothing is pushed to GHCR unless the tagged commit passes the same
  # envtest suite and linter that run on branches.
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  release:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sanity check
        run: go build ./... && go vet ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tazhate/chainplane:${{ github.ref_name }}
            ghcr.io/tazhate/chainplane:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tazhate/chainplane
            org.opencontainers.image.url=https://github.com/tazhate/chainplane
            org.opencontainers.image.documentation=https://github.com/tazhate/chainplane
            org.opencontainers.image.title=chainplane
            org.opencontainers.image.description=Kubernetes operator for blockchain full nodes
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The operator binary defaults to snapshot-restore:<same tag> (VERSION
      # build-arg above), so this image must exist for every release tag.
      - name: Build and push snapshot-restore image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: snapshot-restore.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/tazhate/chainplane/snapshot-restore:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/tazhate/chainplane
            org.opencontainers.image.title=chainplane-snapshot-restore
            org.opencontainers.image.description=Init container that restores blockchain node snapshots for chainplane
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Package and push Helm chart to GHCR
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package charts/chainplane --version ${VERSION}
          helm push chainplane-${VERSION}.tgz oci://ghcr.io/tazhate/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: chainplane-*.tgz
