{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chainplane.fullname" . }}-allow-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chainplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chainplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- if .Values.webhook.enabled }}
    - from: []
      ports:
        - port: {{ .Values.webhook.service.targetPort }}
          protocol: TCP
    {{- end }}
{{- end }}
