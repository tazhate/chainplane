apiVersion: v2
name: chainplane
description: A Kubernetes operator for managing blockchain node lifecycle
type: application
version: 0.2.1
appVersion: "v0.2.1"
kubeVersion: ">=1.26.0-0"
home: https://github.com/tazhate/chainplane
sources:
  - https://github.com/tazhate/chainplane
keywords:
  - blockchain
  - operator
  - kubernetes
  - web3
maintainers:
  - name: tazhate
dependencies:
  # Optional MinIO deployment for snapshot bootstrap.
  # Enable with: --set minio.enabled=true
  - name: minio
    version: "5.4.0"
    repository: "https://charts.min.io/"
    condition: minio.enabled
